# 全局限流与连接限制（conf.d/*.conf 处于 http 上下文，zone 定义写在文件头）
limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查端点（80/443 双模式通用）
    location = /healthz { return 200 'ok'; }

    # 不暴露 nginx 版本
    server_tokens off;
    autoindex off;

    # 纯静态站只读：非 GET/HEAD 一律 405
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # ── 滥用与慢速攻击缓解 ──
    client_max_body_size 1m;          # 站点不接收请求体
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    reset_timedout_connection on;
    limit_req  zone=req_per_ip burst=60 nodelay;
    limit_conn conn_per_ip 30;

    # ── 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 隐藏文件 / 备份文件：一律拒绝（.well-known 留给将来 ACME 申请证书） ──
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|old|orig|save|swp|sql|ini|log|conf|sh)$ { deny all; }

    # ── HTML：始终拿最新 ──
    location = / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── 静态资源：短缓存（URL 已带版本参数） ──
    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|ico|mp4|webm)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ── 更新索引与校验文件：客户端每次都要拿到最新的 ──
    location = /releases.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        charset utf-8;
        try_files /releases.json =404;
    }

    location ~* \.sha256$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # ── APK 下载：Range 断点续传、暴露文件名 ──
    # 固定链接内容会随发版变化，缓存时间不宜长，靠 ETag/Last-Modified 协商复用
    location ~* \.apk$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=1800, must-revalidate" always;
        add_header Content-Disposition 'attachment; filename="MoJi-v0.3-release.apk"' always;
        types { } default_type application/octet-stream;
        try_files $uri =404;
    }

    # ── 其余路径 ──
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }
}
