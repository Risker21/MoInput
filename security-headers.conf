# 安全响应头片段 —— 每个 location 必须 include 一次：
# nginx 的 add_header 不跨层继承，location 内有自己的 add_header 时，
# server 级的安全头会被丢弃（此前的配置就踩了这个坑，所有带缓存头的
# 响应都没带上安全头）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=(), xr-spatial-tracking=()" always;
add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; media-src 'self'; manifest-src 'self'" always;
# HSTS 仅在启用 HTTPS 后有意义；启用 443 时取消注释并保留：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
